# dsh-memoryleak bundle patch: inserts the plugin row into the web profile roster.
# Install with `dsh plugin --profile web add link:<this-repo>`; the row mounts
# BOTH halves — the host side (/ml todo command, settings namespace, /api/memoryleak/*
# routes) and the browser side (the MemoryLeak settings section served from
# src/client.js).
- insert:
    - id: memoryleak
      name: 'dsh-memoryleak'
